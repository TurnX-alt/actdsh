# 实时 registry 探针：提前发现会让版本线钉死失败的上游变化。
#
# 与 CI 的分工（地图 #5 的决议）：CI 跑离线 fixture 回放，确定性地守判定逻辑，
# 阻塞合并；本 workflow 打实时 registry，守的是「外部世界变了」，失败只告警、
# 不阻塞发布——它是独立的 workflow，与 release-desktop.yml 之间没有 needs 关系。
#
# 为什么需要：2026-09-23 的发布失败由 registry 的真实变化触发（libreoffice-kit
# 26 小时内连发 0.0.3 / 0.0.4 / 0.1.0），而钉死脚本只在发布路径上跑，于是第一个
# 发现问题的时机就是发布失败本身。探针把这个时机提前。
#
# 排在 release-desktop.yml（03:23 UTC）之前，好让问题在构建开始前就暴露。
name: 上游版本线探针

on:
  schedule:
    # 每日 UTC 01:41（避开整点高峰；与发布流水线保持同样的约定）
    - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 指定上游 tag 版本（如 0.1.7-rc.1；留空则取上游最新 release）
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'shell/scripts/probe-upstream.mjs'
      - 'shell/scripts/lib/version-line.mjs'
      - '.github/workflows/probe-upstream.yml'
  # PR 上也跑：schedule 只在默认分支生效，而 workflow_dispatch 在纯分支上无法派发
  # （GitHub 只登记出现在默认分支上的 workflow），不加这条就没有任何触发点能验证改动。
  pull_request:
    paths:
      - 'shell/scripts/probe-upstream.mjs'
      - 'shell/scripts/lib/version-line.mjs'
      - '.github/workflows/probe-upstream.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  probe:
    name: 实时 registry 探针
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # 只用 Node 内置能力与仓库自有模块，不需要安装任何依赖。
      # 退出码 3 = 上游 npm 家族还没发齐本轮 tag（分批发布，成员包可比根包晚 20 分钟以上）。
      # 那是会自己关上的窗口，报 warning 就够；把它染红会让每天一次的探针变成噪声源，
      # 而探针的价值恰恰在于红了就值得看。
      - name: 跑探针
        id: probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `|| rc=$?` 而不是 `set +e`：runner 以 `/usr/bin/bash -e` 执行本段，脚本体内不重设 -e
          # 就仍会继承它——第一版写成 `node …; rc=$?`，node 返回 3 时脚本被 -e 直接中止，
          # case 分支根本没跑到（PR #33 的探针运行实测退出码 3 判红）。
          # `| tee` 靠上面的 pipefail 保留 node 的退出码；日志落盘是给失败通知步骤读的。
          rc=0
          node shell/scripts/probe-upstream.mjs '${{ inputs.tag }}' | tee "$RUNNER_TEMP/probe-output.txt" || rc=$?
          case "$rc" in
            0) exit 0 ;;
            3) echo "上游家族尚未发齐，等下一轮（详见上方缺失清单）"; exit 0 ;;
            *) echo "::error::上游版本线探针失败（退出码 $rc）"; exit "$rc" ;;
          esac

      # #29 的「红了」这一类。只在 schedule / workflow_dispatch 上发：push 与 PR 的红属于
      # 开发过程，每次都往群里响会把信噪比打回零。退出码 3 的「等一轮」在这里判 exit 0，
      # 所以它不会变成通知——持续等待超过 12 小时才算第三类信号，那张卡片要跨 run 计数，
      # 属于 #29 剩下的部分。
      - name: 失败时通知飞书
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DSH_FAIL_JOB: 实时 registry 探针
          DSH_FAIL_STEP: 跑探针
          DSH_FAIL_LOG: ${{ runner.temp }}/probe-output.txt
        run: |
          set -uo pipefail
          node shell/scripts/build-failure-card.mjs "$RUNNER_TEMP/failure-card.json"
          node shell/scripts/notify-feishu.mjs "$RUNNER_TEMP/failure-card.json"
