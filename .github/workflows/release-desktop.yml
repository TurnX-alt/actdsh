# actdsh 桌面版发布流水线。
# 订阅 deepseek-ai/deepseek-harness 的 dsh-v* 新 tag，打包 Win/macOS 桌面版并同步发布到本仓库 Releases。
# 设计约束：轮询秒级空转退出；构建仅在有新版本时触发；上游 release 无对应 npm 包（alpha 线只发 GitHub）时跳过空转；每个平台产物先过用户视角验证才允许发布。
name: 桌面版发布

on:
  schedule:
    # 每日 UTC 03:23（避开整点高峰；GitHub cron 允许 5-30 分钟延迟，日粒度下无影响）
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 强制构建指定上游 tag（如 dsh-v0.1.0-rc.8；留空则自动探测最新）
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  poll:
    name: 探测上游新 tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: 比对上游最新 dsh release、npm 可用性与本仓库已发布 tag
        id: check
        run: |
          set -euo pipefail
          forced='${{ inputs.tag }}'
          if [ -n "$forced" ]; then
            tag="$forced"
            version="${tag#dsh-v}"
            if ! npm view "@deepseek-ai/dsh@$version" version >/dev/null 2>&1; then
              echo "::error::强制指定的 $tag 无对应 npm 包 @deepseek-ai/dsh@$version（上游该 release 未发布 npm），无法打包。"
              exit 1
            fi
          else
            # 上游 dsh-v* release 与 npm 发布不同步（alpha 线仅发 GitHub 不发 npm）：
            # 从新到旧逐条跳过无 npm 包的 release；遇到本仓库已发布的 release 即停（更旧的不回填）。
            tag=""
            for rel in $(gh api repos/deepseek-ai/deepseek-harness/releases --jq 'map(select((.draft | not) and (.tag_name | startswith("dsh-v"))))[0:10][].tag_name'); do
              if gh release view "$rel" --repo '${{ github.repository }}' >/dev/null 2>&1; then
                break
              fi
              if npm view "@deepseek-ai/dsh@${rel#dsh-v}" version >/dev/null 2>&1; then
                tag="$rel"
                break
              fi
              echo "跳过 $rel：npm 上无 @deepseek-ai/dsh@${rel#dsh-v}（上游该 release 未发布 npm 包），本轮不可打包。"
            done
            if [ -z "$tag" ]; then
              echo '上游暂无可打包的新 release（最新 dsh-v* 均无对应 npm 包或已发布），本轮空转退出。'
              exit 0
            fi
            version="${tag#dsh-v}"
          fi
          prerelease=$(gh api "repos/deepseek-ai/deepseek-harness/releases/tags/$tag" --jq '.prerelease' 2>/dev/null || echo true)
          echo "发现待打包版本: $tag (version=$version, prerelease=$prerelease)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: 构建并验证 ${{ matrix.name }}
    needs: poll
    if: needs.poll.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DSH_VERSION: ${{ needs.poll.outputs.version }}
      TAG: ${{ needs.poll.outputs.tag }}
      # rc.8 在 macOS runner 实测 npm install 触发 Node 堆内存 OOM（exit 134），此处抬限。
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # dsh plugin 是 pnpm 前转器；为零环境用户把 pnpm 一并打进包内（壳在运行时生成 PATH 垫片）。
      - name: 内置 pnpm
        working-directory: shell/runtime
        run: npm install --no-audit --no-fund pnpm

      # 恢复上游「全部包同一版本线」不变量：把同版本线的 @deepseek-ai/* 全部钉到 tag 精确版本，
      # 独立版本线（cordis 等）以各自最新稳定版显式安装（peer 闭包一并补齐）。
      # 安装走 --legacy-peer-deps：npm 严格模式对 ~200 包 peer 图的全量解析实测 60+ 分钟不收敛
      # （alpha.2 实证，ERESOLVE 每秒一条直到 job 超时被杀）。
      - name: 版本线钉死（release 纯度）
        working-directory: shell/runtime
        run: node ../scripts/pin-upstream.mjs "$DSH_VERSION"

      # dsh 的原生模块与目录对话框 worker 均以官方 Node 为基准（Electron-as-node 已实测踩坑），
      # 故内嵌 nodejs.org 官方运行时，行为与官方 CLI 完全对齐。
      - name: 内嵌官方 Node 运行时
        run: |
          set -euo pipefail
          NODE_VER=24.18.0
          mkdir -p shell/runtime/node
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-win-x64.zip" -o /tmp/node-dist.zip
            unzip -q /tmp/node-dist.zip -d /tmp/node-dist
            cp -R "/tmp/node-dist/node-v${NODE_VER}-win-x64/." shell/runtime/node/
            ./shell/runtime/node/node.exe --version
          else
            curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-darwin-arm64.tar.gz" -o /tmp/node-dist.tar.gz
            tar -xzf /tmp/node-dist.tar.gz -C shell/runtime/node --strip-components 1
            ./shell/runtime/node/bin/node --version
          fi

      - name: 壳版本号对齐上游
        working-directory: shell
        run: npm pkg set "version=$DSH_VERSION"

      - name: 安装壳依赖（electron + electron-builder + sharp）
        working-directory: shell
        run: npm install --no-audit --no-fund

      - name: 生成应用图标（取自上游 dsh web favicon）
        working-directory: shell
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL "https://raw.githubusercontent.com/deepseek-ai/deepseek-harness/$TAG/apps/web/public/favicon.svg" -o build/favicon.svg
          node scripts/make-icon.mjs build/favicon.svg build/icon.png
          cp build/icon.png icon.png
          node scripts/make-dmg-background.mjs
          chmod +x "build/双击我完成安装.command"

      - name: 冒烟验证（Electron 内嵌 Node 拉起 dsh CLI）
        working-directory: shell
        env:
          ELECTRON_RUN_AS_NODE: 1
        run: |
          ./node_modules/.bin/electron "runtime/node_modules/@deepseek-ai/dsh/lib/bin.js" --help > /dev/null
          test -f runtime/node_modules/pnpm/bin/pnpm.cjs

      - name: electron-builder 打包
        working-directory: shell
        run: ./node_modules/.bin/electron-builder --publish never

      # macOS 26.2+ 的 Finder 不渲染 dmgbuild 旧格式 .DS_Store 背景（线上实测回归），
      # 此处用捆绑 dmgbuild 的 python 把 dmg 布局改写为兼容格式（.background/ + pBBk 书签 + 窗口外隐藏项坐标）。
      - name: 修复 dmg Finder 布局（macOS 26.2+ 背景兼容）
        if: runner.os == 'macOS'
        working-directory: shell
        run: |
          set -euo pipefail
          DMGPY=$(find "$HOME/Library/Caches/electron-builder" -path '*dmgbuild-bundle*' -name 'python3.14' 2>/dev/null | head -1)
          if [ -z "$DMGPY" ]; then echo "::error::未找到 electron-builder 捆绑 python"; exit 1; fi
          DMGSITE="$(dirname "$DMGPY")/../lib/python3.14/site-packages"
          PYTHONPATH="$DMGSITE" "$DMGPY" scripts/fix-dmg-finder.py "$(ls dist/*.dmg | head -1)"

      - name: 用户视角验证（启动产物 → 就绪信号 → GUI → 垫片）
        run: |
          set -euo pipefail
          READY=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            # zip 便携的用户路径：解压 → 双击 actdsh.exe。
            ZIP=$(ls shell/dist/*.zip | head -1)
            rm -rf /tmp/actdsh-zip && mkdir -p /tmp/actdsh-zip
            unzip -q "$ZIP" -d /tmp/actdsh-zip
            EXE=$(find /tmp/actdsh-zip -name actdsh.exe | head -1)
            [ -n "$EXE" ] || { echo "::error::zip 内未找到 actdsh.exe"; exit 1; }
            START_TS=$SECONDS
            "$EXE" &
            LOG_DIR="$(cygpath "$APPDATA")/actdsh"
            for i in $(seq 1 120); do
              if [ -f "$LOG_DIR/dsh.log" ] && grep -q 'dsh web:' "$LOG_DIR/dsh.log"; then
                READY=$(grep -o 'dsh web: [^ ]*' "$LOG_DIR/dsh.log" | head -1 | awk '{print $3}')
                break
              fi
              sleep 5
            done
            if [ -z "$READY" ]; then echo "::error::Windows 用户视角验证失败：600 秒内未检测到就绪行"; ls -la "$LOG_DIR" || true; exit 1; fi
            echo "安装+启动总耗时: $((SECONDS-START_TS)) 秒"
            curl -fsS "$READY" | grep -qi 'DeepSeek Harness'
            test -f "$LOG_DIR/shims/pnpm.cmd"
            "$LOG_DIR/shims/pnpm.cmd" --version
            taskkill //F //IM actdsh.exe || true
          else
            DMG=$(ls shell/dist/*.dmg | head -1)
            hdiutil attach -nobrowse -mountpoint /tmp/actdsh-mnt "$DMG"
            test -f "/tmp/actdsh-mnt/双击我完成安装.command"
            test -f "/tmp/actdsh-mnt/请先读我.txt"
            test -f "/tmp/actdsh-mnt/.background/background.png" || test -f "/tmp/actdsh-mnt/.background/background.tiff"
            mkdir -p /tmp/actdsh-app
            cp -R "/tmp/actdsh-mnt/actdsh.app" /tmp/actdsh-app/
            hdiutil detach /tmp/actdsh-mnt
            APP=/tmp/actdsh-app/actdsh.app
            LOG_DIR="$HOME/Library/Application Support/actdsh"
            # Gatekeeper 用户视角模拟：写入隔离属性 → open 应被拒/挂起；解除后应可运行。
            # open(1) 在无头 runner 上可能无限挂起（实测导致 45 分钟超时），必须带看门狗。
            xattr -w com.apple.quarantine "0003;66d3c000;Safari;" "$APP"
            open "$APP" & OPEN_PID=$!
            sleep 15
            if kill -0 "$OPEN_PID" 2>/dev/null; then
              kill "$OPEN_PID" 2>/dev/null || true
              echo "隔离状态下 open 挂起/被拒（符合预期：Gatekeeper 拦截需用户交互）"
            else
              echo "open 已返回（隔离拒绝为异步时属正常）"
            fi
            pkill -f 'actdsh.app' || true
            sleep 2
            xattr -dr com.apple.quarantine "$APP"
            # 直接执行主程序二进制（等价双击启动；绕开 open 在无头 runner 上挂起的路径）
            "$APP/Contents/MacOS/actdsh" &
            for i in $(seq 1 72); do
              if [ -f "$LOG_DIR/dsh.log" ] && grep -q 'dsh web:' "$LOG_DIR/dsh.log"; then
                READY=$(grep -o 'dsh web: [^ ]*' "$LOG_DIR/dsh.log" | head -1 | awk '{print $3}')
                break
              fi
              sleep 5
            done
            if [ -z "$READY" ]; then echo "::error::macOS 用户视角验证失败：360 秒内未检测到就绪行"; exit 1; fi
            curl -fsS "$READY" | grep -qi 'DeepSeek Harness'
            test -f "$LOG_DIR/shims/pnpm"
            "$LOG_DIR/shims/pnpm" --version
            pkill -f 'actdsh.app' || true
          fi
          echo "== $RUNNER_OS 用户视角验证通过: $READY =="

      - name: 归档构建版本清单
        run: cp shell/runtime/upstream-versions.json "shell/dist/upstream-versions-${{ matrix.name }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: |
            shell/dist/*.zip
            shell/dist/*.dmg
            shell/dist/*.json
          if-no-files-found: error
          retention-days: 1

  release:
    name: 聚合发布 ${{ needs.poll.outputs.tag }}
    needs: [poll, build]
    if: needs.poll.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.poll.outputs.tag }}
      PRERELEASE: ${{ needs.poll.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: 生成 release notes（含上游发布说明）
        run: |
          set -euo pipefail
          {
            echo "对应上游 [deepseek-ai/deepseek-harness $TAG](https://github.com/deepseek-ai/deepseek-harness/releases/tag/$TAG)。"
            echo
            echo '## 上游发布说明'
            echo
            gh api "repos/deepseek-ai/deepseek-harness/releases/tags/$TAG" --jq '.body // "（上游未填写发布说明）"'
            echo
            echo '## 安装与运行'
            echo
            echo '参见 [README](https://github.com/${{ github.repository }}#readme)：Windows zip 解压即用；macOS 打开 dmg 后双击「双击我完成安装.command」即可（也可手动 xattr 解除隔离）。'
            echo
            echo '## 构建版本清单'
            echo
            M=$(ls dist/upstream-versions-*.json | head -1)
            echo "- dsh 家族包：$(jq '.pinnedCount' "$M") 个全部锁定上游 tag 精确版本"
            echo "- 独立版本线（上游设计如此，不随 tag）：$(jq -r '.independent | to_entries | map("\(.key)@\(.value)") | join("、")' "$M")"
          } > notes.md

      - name: 创建 release 并一次性挂齐全部产物
        run: |
          set -euo pipefail
          args=()
          if [ "$PRERELEASE" = 'true' ]; then args+=(--prerelease); fi
          gh release create "$TAG" --repo '${{ github.repository }}' --title "$TAG" --notes-file notes.md "${args[@]}" dist/*
