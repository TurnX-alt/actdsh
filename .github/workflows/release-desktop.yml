# actdsh 桌面版发布流水线。
# 订阅 deepseek-ai/deepseek-harness 的 dsh-v* 新 tag，打包 Windows 桌面版并同步发布到本仓库 Releases。
# 设计约束：轮询秒级空转退出；构建仅在有新版本时触发；上游 release 无对应 npm 包（alpha 线只发 GitHub）时跳过空转；产物先过用户视角验证、并复核官方桌面版产物与通道声明一致，才允许发布。
#
# 2026-09-25 起只发 Windows（地图 #17 的 D1）。macOS 不再是本流水线的目标：官方自 09-24 起经
# download.deepseek.com/dsh-desk/ 发布经 Apple 公证、带自动更新的 dmg 与 zip，而 actdsh 的 mac 产物
# 两者皆无；每次 mac 构建还要吃 8.25 分钟 × 10 倍 macOS 计费率。actdsh 在这一层剩下的独占项是
# Windows 免安装 zip（官方只有 NSIS 安装器），版本线钉死清单则与平台无关、随每次发布照常产出。
name: 桌面版发布

on:
  schedule:
    # 每日 UTC 03:23（避开整点高峰；GitHub cron 允许 5-30 分钟延迟，日粒度下无影响）
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 强制构建指定上游 tag（如 dsh-v0.1.0-rc.8；留空则自动探测最新）
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  poll:
    name: 探测上游新 tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: 比对上游最新 dsh release、npm 可用性与本仓库已发布 tag
        id: check
        run: |
          set -euo pipefail
          forced='${{ inputs.tag }}'
          if [ -n "$forced" ]; then
            tag="$forced"
            version="${tag#dsh-v}"
            if ! npm view "@deepseek-ai/dsh@$version" version >/dev/null 2>&1; then
              echo "::error::强制指定的 $tag 无对应 npm 包 @deepseek-ai/dsh@$version（上游该 release 未发布 npm），无法打包。"
              exit 1
            fi
          else
            # 上游 dsh-v* release 与 npm 发布不同步（alpha 线仅发 GitHub 不发 npm）：
            # 从新到旧逐条跳过无 npm 包的 release；遇到本仓库已发布的 release 即停（更旧的不回填）。
            tag=""
            for rel in $(gh api repos/deepseek-ai/deepseek-harness/releases --jq 'map(select((.draft | not) and (.tag_name | startswith("dsh-v"))))[0:10][].tag_name'); do
              if gh release view "$rel" --repo '${{ github.repository }}' >/dev/null 2>&1; then
                break
              fi
              if npm view "@deepseek-ai/dsh@${rel#dsh-v}" version >/dev/null 2>&1; then
                tag="$rel"
                break
              fi
              echo "跳过 $rel：npm 上无 @deepseek-ai/dsh@${rel#dsh-v}（上游该 release 未发布 npm 包），本轮不可打包。"
            done
            if [ -z "$tag" ]; then
              echo '上游暂无可打包的新 release（最新 dsh-v* 均无对应 npm 包或已发布），本轮空转退出。'
              exit 0
            fi
            version="${tag#dsh-v}"
          fi
          prerelease=$(gh api "repos/deepseek-ai/deepseek-harness/releases/tags/$tag" --jq '.prerelease' 2>/dev/null || echo true)
          echo "发现待打包版本: $tag (version=$version, prerelease=$prerelease)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: 构建并验证 windows-x64
    needs: poll
    if: needs.poll.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DSH_VERSION: ${{ needs.poll.outputs.version }}
      TAG: ${{ needs.poll.outputs.tag }}
      # rc.8 在 runner 上实测 npm install 触发 Node 堆内存 OOM（exit 134），此处抬限。
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # dsh plugin 是 pnpm 前转器；为零环境用户把 pnpm 一并打进包内（壳在运行时生成 PATH 垫片）。
      - name: 内置 pnpm
        working-directory: shell/runtime
        run: npm install --no-audit --no-fund pnpm

      # 恢复上游「全部包同一版本线」不变量：把同版本线的 @deepseek-ai/* 全部钉到 tag 精确版本，
      # 独立版本线（cordis 等）以各自最新稳定版显式安装（peer 闭包一并补齐）。
      # 安装走 --legacy-peer-deps：npm 严格模式对 ~200 包 peer 图的全量解析实测 60+ 分钟不收敛
      # （alpha.2 实证，ERESOLVE 每秒一条直到 job 超时被杀）。
      - name: 版本线钉死（release 纯度）
        working-directory: shell/runtime
        run: node ../scripts/pin-upstream.mjs "$DSH_VERSION"

      # dsh 的原生模块与目录对话框 worker 均以官方 Node 为基准（Electron-as-node 已实测踩坑），
      # 故内嵌 nodejs.org 官方运行时，行为与官方 CLI 完全对齐。
      - name: 内嵌官方 Node 运行时
        run: |
          set -euo pipefail
          NODE_VER=24.18.0
          mkdir -p shell/runtime/node
          curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-win-x64.zip" -o /tmp/node-dist.zip
          unzip -q /tmp/node-dist.zip -d /tmp/node-dist
          cp -R "/tmp/node-dist/node-v${NODE_VER}-win-x64/." shell/runtime/node/
          ./shell/runtime/node/node.exe --version

      - name: 壳版本号对齐上游
        working-directory: shell
        run: npm pkg set "version=$DSH_VERSION"

      - name: 安装壳依赖（electron + electron-builder + sharp）
        working-directory: shell
        run: npm install --no-audit --no-fund

      - name: 生成应用图标（取自上游 dsh web favicon）
        working-directory: shell
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL "https://raw.githubusercontent.com/deepseek-ai/deepseek-harness/$TAG/apps/web/public/favicon.svg" -o build/favicon.svg
          node scripts/make-icon.mjs build/favicon.svg build/icon.png
          cp build/icon.png icon.png

      - name: 冒烟验证（Electron 内嵌 Node 拉起 dsh CLI）
        working-directory: shell
        env:
          ELECTRON_RUN_AS_NODE: 1
        run: |
          ./node_modules/.bin/electron "runtime/node_modules/@deepseek-ai/dsh/lib/bin.js" --help > /dev/null
          test -f runtime/node_modules/pnpm/bin/pnpm.cjs

      - name: electron-builder 打包
        working-directory: shell
        run: ./node_modules/.bin/electron-builder --publish never

      - name: 用户视角验证（启动产物 → 就绪信号 → GUI → 垫片）
        run: |
          set -euo pipefail
          READY=""
          # zip 便携的用户路径：解压 → 双击 actdsh.exe。
          ZIP=$(ls shell/dist/*.zip | head -1)
          rm -rf /tmp/actdsh-zip && mkdir -p /tmp/actdsh-zip
          unzip -q "$ZIP" -d /tmp/actdsh-zip
          EXE=$(find /tmp/actdsh-zip -name actdsh.exe | head -1)
          [ -n "$EXE" ] || { echo "::error::zip 内未找到 actdsh.exe"; exit 1; }
          START_TS=$SECONDS
          "$EXE" &
          LOG_DIR="$(cygpath "$APPDATA")/actdsh"
          for i in $(seq 1 120); do
            if [ -f "$LOG_DIR/dsh.log" ] && grep -q 'dsh web:' "$LOG_DIR/dsh.log"; then
              READY=$(grep -o 'dsh web: [^ ]*' "$LOG_DIR/dsh.log" | head -1 | awk '{print $3}')
              break
            fi
            sleep 5
          done
          if [ -z "$READY" ]; then echo "::error::Windows 用户视角验证失败：600 秒内未检测到就绪行"; ls -la "$LOG_DIR" || true; exit 1; fi
          echo "安装+启动总耗时: $((SECONDS-START_TS)) 秒"
          # 就绪 URL 带一次性 token 并 303 重定向到会话，故必须 -L 跟随并保存 cookie，
          # 否则 -f 会把 303 判成 HTTP 错误退出 22。响应体必须落盘再 grep：`curl | grep -q`
          # 下 grep 命中即退出并关闭管道，curl 写剩余 body 会以 23 (CURLE_WRITE_ERROR) 失败，
          # pipefail 再放大成整步失败——竞态，同一份脚本能连过多次后突然挂。
          curl -fsSL -c /tmp/actdsh-cookie "$READY" -o /tmp/actdsh-ready.html
          grep -qi 'DeepSeek Harness' /tmp/actdsh-ready.html
          test -f "$LOG_DIR/shims/pnpm.cmd"
          "$LOG_DIR/shims/pnpm.cmd" --version
          taskkill //F //IM actdsh.exe || true
          echo "== 用户视角验证通过: $READY =="

      - name: 归档构建版本清单
        run: cp shell/runtime/upstream-versions.json shell/dist/upstream-versions-windows-x64.json

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-x64
          path: |
            shell/dist/*.zip
            shell/dist/*.json
          if-no-files-found: error
          retention-days: 1

  release:
    name: 聚合发布 ${{ needs.poll.outputs.tag }}
    needs: [poll, build]
    if: needs.poll.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.poll.outputs.tag }}
      PRERELEASE: ${{ needs.poll.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      # 官方的 dsh-v* Release 在 GitHub 上一个 assets 都没有，桌面包只走 download.deepseek.com，
      # 于是没有任何第三方核对过「通道声明的 sha512 == CDN 上真实字节」。这一步补上这个空缺，
      # 并把结论写进本仓库发布说明。失败即阻断发布：宁可因网络抖动重跑，也不放过声明与字节不一致。
      - name: 复核官方桌面版产物（发布闸门）
        id: official
        run: node shell/scripts/verify-official-artifact.mjs win-x64

      - name: 生成 release notes（含上游发布说明）
        run: |
          set -euo pipefail
          OFFICIAL_SUMMARY='${{ steps.official.outputs.summary }}'
          if [ -z "$OFFICIAL_SUMMARY" ]; then OFFICIAL_SUMMARY='（本次未取到复核结论）'; fi
          {
            echo "对应上游 [deepseek-ai/deepseek-harness $TAG](https://github.com/deepseek-ai/deepseek-harness/releases/tag/$TAG)。"
            echo
            echo '## 上游发布说明'
            echo
            gh api "repos/deepseek-ai/deepseek-harness/releases/tags/$TAG" --jq '.body // "（上游未填写发布说明）"'
            echo
            echo '## 安装与运行'
            echo
            echo 'Windows zip 解压即用（见 [README](https://github.com/${{ github.repository }}#readme)）。macOS 请直接用官方桌面版，它接了自动更新；本仓库不再产出 mac 包。'
            echo
            echo '## 官方桌面版产物复核'
            echo
            echo "- $OFFICIAL_SUMMARY"
            echo
            echo '官方经 `download.deepseek.com` 发布桌面版，其 GitHub Release 不含任何产物；这一条是本仓库对流出的字节与官方通道声明是否一致所做的独立核对。'
            echo
            echo '## 构建版本清单'
            echo
            M=$(ls dist/upstream-versions-*.json | head -1)
            echo "- dsh 家族包：$(jq '.pinnedCount' "$M") 个全部锁定上游 tag 精确版本"
            echo "- 独立版本线（上游设计如此，不随 tag）：$(jq -r '.independent | to_entries | map("\(.key)@\(.value)") | join("、")' "$M")"
          } > notes.md

      - name: 创建 release 并一次性挂齐全部产物
        run: |
          set -euo pipefail
          args=()
          if [ "$PRERELEASE" = 'true' ]; then args+=(--prerelease); fi
          gh release create "$TAG" --repo '${{ github.repository }}' --title "$TAG" --notes-file notes.md "${args[@]}" dist/*
