# 直接调用上游官方打包命令，产出与官方同形态的桌面版安装包。
#
# 与 release-desktop.yml 的分工：那条线从 npm 取 @deepseek-ai/dsh 再套自制 Electron 壳，
# 出的是免安装 zip 与自制 dmg；这条线 checkout 上游源码，用上游自己的 electron-builder
# 配置出包，Windows 产物是官方的 NSIS 安装器。
#
# 平台覆盖只有 win-x64，原因在上游而不在本仓库：
#   - apps/desktop/scripts/package-target.ts:237 把 --unsigned 限定为 win-x64
#   - apps/desktop/scripts/desktop-release-environment.mjs:120 强制 macOS 打包必须提供
#     Apple 凭据（APPLE_API_KEY 三件套 / APPLE_ID 三件套 / APPLE_KEYCHAIN_PROFILE 之一）
#   - apps/desktop/scripts/electron-builder-config.mjs:66 在配置加载期就执行该校验，
#     所以 --config.mac.notarize=false 绕不过去
# 要加 macOS，得先有 Apple Developer ID 或 App Store Connect API Key。
#
# 触发方式说明：GitHub 只登记出现在默认分支上的 workflow，纯分支上的 workflow_dispatch
# 无法通过 API 派发，所以这里补一条 paths 限定的 push 触发——只有改到本文件才会构建，
# 分支上的其他提交不会白跑一两个小时。
name: 官方桌面版打包

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 上游 tag（留空则自动取上游最新 dsh-v* release）
        required: false
        type: string
  push:
    branches: [official-packaging]
    paths: ['.github/workflows/build-official-desktop.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  win-x64:
    name: 官方打包 windows-x64（unsigned）
    # 上游 package-target.ts:180 要求 win-x64 必须在 Windows x64 构建机上打，不支持交叉编译。
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # 上游 monorepo 装依赖时默认堆会 OOM，release-desktop.yml 里有同样的实测记录。
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: 解析目标 tag
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          requested='${{ inputs.tag }}'
          if [ -n "$requested" ]; then
            tag="$requested"
          else
            tag=$(gh api 'repos/deepseek-ai/deepseek-harness/releases?per_page=20' \
              --jq '[.[] | select(.tag_name | startswith("dsh-v"))][0].tag_name')
          fi
          if [ -z "$tag" ]; then echo '::error::解析不到上游 dsh-v* tag'; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "目标 tag: $tag"

      - name: 检出上游源码
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 记录工具链版本
        run: |
          node --version
          pnpm --version
          echo "上游 tag: ${{ steps.target.outputs.tag }}"
          node -p "require('./package.json').version"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # package-target.ts 顶层静态 import 了 macos-notarization-proxy.ts，后者依赖
      # @deepseek-ai/node-addon-system/lib/flock.js。这个 lib/ 是 tsc 产物，而生成它的
      # 命令（package-target.ts:462 的 pnpm --dir native/system run build:ts）写在脚本
      # 自身内部，模块解析阶段就已经失败了。上游没有任何 workflow 调用 package:desktop，
      # 所以这个顺序问题只在干净检出时暴露，得由调用方先补上。
      - name: 预构建 native-system TypeScript
        run: pnpm --dir native/system run build:ts

      # package-target.ts 通过 loadDesktopPackageEnvironment 强制读取 apps/desktop/.env.windows，
      # 该文件被上游 gitignore，属于发布操作员的本地配置，干净检出时必然缺失。
      # unsigned 模式的校验在 desktop-package-environment.mjs:85 提前返回，只要求
      # APP_ID / NPM_REGISTRY / 强制更新策略 / Windows 打包设置四项，不需要签名与更新源凭据。
      #
      # 下面两个 origin 是上游自己的占位值（见 scripts/test-windows-installer.mjs:50-52），
      # 不是真实服务地址。产物里会烘进一条指向 test.example.com 的强制更新策略；
      # unsigned 构建的 publish 为 null、没有自动更新源，且上游测试名显示策略失败是静默的
      # （"keeps policy failures silent while an ordinary update proceeds"）。
      # 若要对外发布，这两个 origin 该填什么需要先定。
      - name: 生成 unsigned 构建所需的 .env.windows
        working-directory: apps/desktop
        run: |
          cat > .env.windows <<'ENV'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://test.example.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.example.com"]}'
          DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4
          ENV
          cat .env.windows

      - name: 官方打包（unsigned）
        run: pnpm package:desktop:win:x64:unsigned

      - name: 列出产物
        run: ls -la apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: official-win-x64-${{ steps.target.outputs.tag }}
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/
          if-no-files-found: error
